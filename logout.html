<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout | Indian Railways</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .logout-container {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            color: #dc3545;
            margin-bottom: 30px;
            font-weight: 600;
            font-size: 2rem;
        }

        .logout-icon {
            font-size: 4rem;
            color: #dc3545;
            margin-bottom: 20px;
        }

        p {
            color: #555;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .logout-button {
            background-color: #dc3545;
            color: white;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background-color 0.3s ease;
            font-weight: 500;
            text-decoration: none;
        }

        .logout-button:hover {
            background-color: #c82333;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
            font-size: 1rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #0056b3;
        }

        .back-link i {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <i class="fas fa-sign-out-alt logout-icon"></i>
        <h2>Ready to Log Out?</h2>
        <p>Are you sure you want to sign out of your Indian Railways account?</p>
        <button class="logout-button" onclick="logout()">
            <i class="fas fa-power-off"></i> Log Out
        </button>
        <a href="dashboard.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
    </div>

    <script>
        function logout() {
            sessionStorage.removeItem('currentUser');
            alert('You have been logged out successfully. Thank you for using our service!');
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
